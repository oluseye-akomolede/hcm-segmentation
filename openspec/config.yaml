schema: spec-driven

context: |
  ecs_hcm_model: a custom PyTorch computer-vision model (ecs_hcm_model/core/hcm_nn.py)
  trained on ImageNet-1k / COCO segmentation on a homelab Kubernetes cluster (Airflow DAG
  owned by the sys_dags rig), tracked in MLflow, checkpoints in MinIO. jetson/realtime_demo.py
  runs camera inference on a Jetson Orin Nano. The trainer image pins torch 2.1.0 (cu121).
  Specs describe behaviour that matters to a training run or a consumer of its outputs
  (lr schedule, resume selection, numerics, logged metrics, env overrides, image contract),
  not every line. Requirements must be checkable against code or a test.
  Constraints: never train on the dev VM; secrets only from the environment.

